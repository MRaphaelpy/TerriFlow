name: Build & Release TerriFlow APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Determine Version Tag
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.version_name }}" -PversionCode="${{ steps.version.outputs.version_code }}" --no-daemon

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREVIOUS_TAG:+$PREVIOUS_TAG..HEAD}
          git log $RANGE --no-merges --pretty=format:'%s%n' \
            | grep -E '^(feat|fix|perf)(\(|:)' \
            | sed -E 's/^feat(\([^)]*\))?: /- Novo: /; s/^fix(\([^)]*\))?: /- Correção: /; s/^perf(\([^)]*\))?: /- Desempenho: /' \
            > release-notes.md || true
          if [ ! -s release-notes.md ]; then echo "- Melhorias gerais e correções." > release-notes.md; fi
          cat release-notes.md

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/TerriFlow.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "TerriFlow ${{ steps.version.outputs.tag }}"
          files: release-apk/TerriFlow.apk
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
